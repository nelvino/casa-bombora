[build]
  command = "npx prisma generate && npm run build"
  publish = ".next"

[build.environment]
  # These vars are public by design (inlined into client/middleware bundles) —
  # exempt them from secrets scanning. Anything else flagged is a real leak.
  SECRETS_SCAN_OMIT_KEYS = "SITE_LIVE,ADMIN_USERNAME,EMAIL_FROM,ADMIN_EMAIL,NEXT_PUBLIC_SUPABASE_URL,NEXT_PUBLIC_BASE_URL"
  SECRETS_SCAN_OMIT_PATHS = "**/.next/**,**/node_modules/**,**/.netlify/**"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[functions]
  directory = "netlify/functions"

# Security headers — CSP is intentionally omitted (Next.js inline scripts would
# need nonces); the rest are safe to apply site-wide.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
